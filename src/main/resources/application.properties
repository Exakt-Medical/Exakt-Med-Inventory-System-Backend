spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:Backend/.env[.properties]

# ------------------------------
# PostgreSQL Database Config (Active)
# ------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-database-1-instance-1.ckkt8rzd70j2.ap-southeast-1.rds.amazonaws.com:5432/ExaktInventory}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:exaktinveuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:exaktpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

